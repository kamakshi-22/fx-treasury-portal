server:
  port: 8081

spring:
  application:
    name: trade-capture-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fx_treasury?currentSchema=fx_object
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Let Flyway manage table generation
    properties:
      hibernate:
        format_sql: true
        default_schema: fx_object
    open-in-view: false #connections open only for active transactions

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: fx_object
    create-schemas: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Use StringSerializer since outbox payload is already JSON string
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      trades-raw: fx.trades.raw

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true